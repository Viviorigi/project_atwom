<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .col-lg-6 {
            padding: 2rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .form-group label {
            font-weight: 600;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 0.25rem;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="col-lg-6 m-auto mt-5">
            <h2>Đặt Lại Mật Khẩu</h2>
            <form id="resetPasswordForm" action="http://localhost:8196/api/auth/reset-password" method="POST">
                <h5 class="text-danger" th:text="${message}"></h5>
                <input type="hidden" name="token" id="token" value="{{token}}">
                
                <div class="form-group">
                    <label for="newPassword">Mật Khẩu Mới</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Xác Nhận Mật Khẩu Mới</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Đặt Lại Mật Khẩu</button>
            </form>
        </div>
    </div>

    <script>
        // Lấy token từ URL và đặt vào trường ẩn
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('token').value = token;

        // Thêm kiểm tra phía client để đảm bảo hai mật khẩu khớp nhau
        const form = document.getElementById('resetPasswordForm');
        form.addEventListener('submit', function(event) {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Mật khẩu không khớp!');
                event.preventDefault();
            }
        });
    </script>
</body>

</html>
