<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		body {
		    background-color: #f8f9fa;
		}
		
		.container {
		    background-color: #ffffff;
		    padding: 2rem;
		    border-radius: 0.5rem;
		    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		
		.col-lg-6 {
		    padding: 2rem;
		}
		
		h2 {
		    margin-bottom: 1.5rem;
		    color: #343a40;
		}
		
		.form-group label {
		    font-weight: 600;
		}
		
		.btn-primary {
		    background-color: #007bff;
		    border-color: #007bff;
		    border-radius: 0.25rem;
		}
		
		.btn-primary:hover {
		    background-color: #0056b3;
		    border-color: #004085;
		}
	</style>
</head>
<body>
    <div class="container mt-5">
        
        <div class="col-lg-6 m-auto mt-5">
			<h2>Reset Password</h2>
			<form id="resetPasswordForm" action="http://localhost:8080/api/auth/reset-password" method="POST">
					<h5 class="text-danger" th:text="${message}"></h5>
			            <input type="hidden" name="token" id="token" value="{{token}}">
			            
			            <div class="form-group">
			                <label for="newPassword">New Password</label>
			                <input type="password" class="form-control" id="newPassword" name="newPassword" required>
			            </div>
			            
			            <div class="form-group">
			                <label for="confirmPassword">Confirm New Password</label>
			                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
			            </div>
			            
			            <button type="submit" class="btn btn-primary">Reset Password</button>
			        </form>
		</div>
    </div>

    <script>
        // Get the token from the URL and set it in the hidden input field
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('token').value = token;

        // Add client-side validation to check if both passwords match
        const form = document.getElementById('resetPasswordForm');
        form.addEventListener('submit', function(event) {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
