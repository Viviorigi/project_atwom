<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Success</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		body {
			text-align: center;
			padding: 40px 0;
			background: #EBF0F5;
		}
	
		h1 {
			color: #88B04B;
			font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
			font-weight: 900;
			font-size: 40px;
			margin-bottom: 10px;
		}
	
		p {
			color: #404F5E;
			font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
			font-size: 20px;
			margin: 0;
		}
	
		i {
			color: #9ABC66;
			font-size: 100px;
			line-height: 200px;
			margin-left: -15px;
		}
	
		.card {
			background: white;
			padding: 60px;
			border-radius: 4px;
			box-shadow: 0 2px 3px #C8D0D8;
			display: inline-block;
			margin: 0 auto;
		}
	</style>
</head>
<body>
    <div class="container mt-5">
		<div class="card">
			<div style="border-radius:200px; height:200px; width:200px; background: #F8FAF5; margin:0 auto;">
				<i class="checkmark">✓</i>
			</div>
			<h1>Success</h1>
			<p th:text="${message}"></p>
			<p>Your password has been successfully changes. You can now log in.</p>
			<a href="http://localhost:3333/login" class="btn btn-primary">Go to Login Page</a>
		</div>
    </div>
</body>
</html>
